<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>你是哪种 AI 程序员？</title>
<meta name="description" content="12 道题，测出你是哪种 AI 程序员。央企物流 AI 社区 DataClawHub 出品。">
<meta name="format-detection" content="telephone=no">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='0' fill='%2315181f'/%3E%3Cpath d='M16 40l10-18 8 12 6-8 8 14' stroke='%23c8ff3d' stroke-width='6' fill='none' stroke-linecap='square' stroke-linejoin='miter'/%3E%3C/svg%3E">
<style>
:root{
  --ink:#15181f; --paper:#f3f5ec; --surface:#ffffff;
  --accent:#c8ff3d; --shadow:#93be1f; --muted:#5c6470; --line:#15181f;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  min-height:100vh;color:var(--ink);background:var(--paper);
  font-family:"Microsoft YaHei","PingFang SC",system-ui,-apple-system,sans-serif;
  -webkit-text-size-adjust:100%;
}
.grain{
  position:fixed;inset:0;pointer-events:none;opacity:.12;z-index:0;
  background-image:radial-gradient(var(--ink) .6px,transparent .6px);
  background-size:7px 7px;mix-blend-mode:multiply;
}
main{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:22px 18px 56px}
.hidden{display:none!important}

/* 顶栏 */
.topline{display:flex;justify-content:space-between;align-items:center;gap:10px;
  font-size:.8rem;font-weight:800;letter-spacing:.04em}
.stamp{border:2px solid var(--line);padding:5px 9px;background:var(--accent)}

/* 封面 */
.hero{padding:44px 0 26px}
h1{margin:0;font-size:clamp(2.3rem,11vw,3.6rem);line-height:.95;letter-spacing:-.05em;font-weight:900}
h1 em{color:#6d8a12;font-style:normal}
.lead{margin:18px 0 0;font-size:1rem;line-height:1.7;color:#3a4150}
.rule{height:3px;background:var(--line);margin:18px 0 20px}
.notice{margin-top:20px;padding-left:11px;border-left:3px solid var(--accent);
  font-size:.8rem;line-height:1.55;color:var(--muted)}

/* 按钮 */
.button{
  appearance:none;display:inline-block;border:2px solid var(--line);color:var(--ink);
  background:var(--accent);cursor:pointer;border-radius:0;padding:13px 18px;
  font:inherit;font-weight:900;font-size:1rem;text-decoration:none;text-align:center;
  box-shadow:5px 5px 0 var(--shadow);
  transition:transform .16s cubic-bezier(.16,1,.3,1),box-shadow .16s cubic-bezier(.16,1,.3,1);
}
.button:hover{transform:translate(3px,3px);box-shadow:2px 2px 0 var(--shadow)}
.button:active{transform:translate(5px,5px);box-shadow:none}
.button.alt{background:var(--surface)}
.button:focus-visible{outline:3px solid #6d8a12;outline-offset:3px}
.button[disabled]{opacity:.45;cursor:not-allowed;transform:none;box-shadow:5px 5px 0 var(--shadow)}

/* 进度 */
.progress{display:flex;align-items:center;gap:12px;margin:10px 0 16px;font-weight:900;font-size:.9rem}
.bar{flex:1;height:12px;border:2px solid var(--line);background:var(--surface)}
.fill{width:0;height:100%;background:var(--accent);transition:width .25s ease}

/* 题目 */
.question{background:var(--surface);border:2px solid var(--line);padding:20px 18px;
  box-shadow:8px 8px 0 var(--shadow)}
.eyebrow{color:#6d8a12;font-size:.78rem;font-weight:900;letter-spacing:.08em}
.question h2{margin:10px 0 20px;font-size:clamp(1.12rem,4.6vw,1.4rem);line-height:1.42;letter-spacing:-.015em}
.answers{display:grid;gap:10px}
.answer{width:100%;text-align:left;background:var(--paper);border:2px solid var(--line);
  padding:14px 15px;cursor:pointer;color:var(--ink);font:inherit;font-weight:700;
  font-size:.95rem;line-height:1.5;border-radius:0;
  transition:transform .16s cubic-bezier(.16,1,.3,1),background .16s}
.answer:hover{transform:translateX(4px);background:var(--accent)}
.answer:active{transform:translateX(7px)}
.answer:focus-visible{outline:3px solid #6d8a12;outline-offset:2px}
.quiz-actions{margin-top:16px}
.back{border:0;border-bottom:2px solid var(--line);background:transparent;color:var(--ink);
  cursor:pointer;font:inherit;font-weight:800;font-size:.9rem;padding:4px 0}
.back:hover{color:#6d8a12;border-color:#6d8a12}
.back[disabled]{border-color:transparent;color:var(--muted);cursor:not-allowed}

/* 结果 */
.done{display:flex;align-items:center;gap:12px;margin:10px 0 16px;font-weight:900;font-size:.9rem}
.result-head{background:var(--surface);border:2px solid var(--line);padding:18px;
  box-shadow:8px 8px 0 var(--shadow)}
.code{display:inline-block;background:var(--accent);padding:5px 9px;font-weight:900;font-size:.82rem}
.result-head h2{margin:14px 0 8px;font-size:clamp(1.7rem,7.5vw,2.4rem);line-height:.98;letter-spacing:-.04em}
.result-head p{margin:10px 0 0;font-size:.95rem;line-height:1.65}

.card-wrap{margin-top:18px;border:2px solid var(--line);background:var(--surface);
  box-shadow:8px 8px 0 var(--shadow)}
.card-wrap img{display:block;width:100%;height:auto}
.card-hint{margin-top:12px;padding:11px 13px;background:var(--surface);border-left:5px solid var(--accent);
  font-size:.88rem;line-height:1.55;font-weight:700}
.card-hint b{background:var(--accent);padding:1px 5px}

.share-box{margin-top:18px;background:var(--surface);border:2px solid var(--line);padding:16px;
  box-shadow:8px 8px 0 var(--shadow)}
.share-box h3{margin:0 0 10px;font-size:1rem}
.share-preview{margin:0 0 14px;padding:11px 12px;background:var(--paper);border:2px solid var(--line);
  font-size:.86rem;line-height:1.6;white-space:pre-wrap;word-break:break-word}
.share-actions{display:flex;flex-wrap:wrap;gap:10px}
.share-actions .button{flex:1 1 auto;font-size:.92rem;padding:11px 14px}

.cta{margin-top:18px;display:block;width:100%;font-size:1.02rem}
.footnote{margin-top:26px;font-size:.78rem;color:var(--muted);line-height:1.6}

/* 提示条 */
.toast{
  position:fixed;left:50%;bottom:26px;transform:translate(-50%,140%);
  background:var(--ink);color:var(--paper);border:2px solid var(--ink);
  padding:11px 18px;font-weight:800;font-size:.9rem;z-index:50;
  transition:transform .26s cubic-bezier(.16,1,.3,1);max-width:88vw;text-align:center;
}
.toast.show{transform:translate(-50%,0)}

@media (max-width:380px){
  .topline{font-size:.74rem}
  .question{padding:17px 14px}
  .card-hint{font-size:.84rem}
}
@media (prefers-color-scheme:dark){
  :root{ --ink:#eef1e8; --paper:#141821; --surface:#1d2330;
         --accent:#c8ff3d; --shadow:#7f9f1c; --muted:#a8b1bd; --line:#eef1e8; }
  body{background:var(--paper)}
  .grain{mix-blend-mode:screen;opacity:.07}
  h1 em,.eyebrow,.back:hover{color:var(--accent)}
  .lead{color:#cfd5de}
  .answer{background:#232a38}
  .answer:hover{color:#15181f}
  .share-preview{background:#171d27}
  .button{color:#15181f}
  .stamp,.code{color:#15181f}
}
</style>
</head>
<body>
<div class="grain"></div>
<main>

  <header class="topline">
    <span>DataClawHub</span>
    <span class="stamp">央企物流 AI 社区</span>
  </header>

  <!-- ========== 封面 ========== -->
  <section id="intro" class="hero">
    <h1>你是哪种<br><em>AI 程序员？</em></h1>
    <p class="lead">12 道情境题，从你做事的方式里，认出你属于哪一类智能体开发者。</p>
    <div class="rule"></div>
    <button id="start" class="button" type="button">开始测试 · 约 2 分钟</button>
    <div class="notice">不收集个人信息。结果只在你的手机上生成。</div>
  </section>

  <!-- ========== 答题 ========== -->
  <section id="quiz" class="hidden">
    <div class="progress">
      <span id="count">01 / 12</span>
      <div class="bar"><div id="fill" class="fill"></div></div>
    </div>
    <div class="question">
      <div id="eyebrow" class="eyebrow">第 01 题</div>
      <h2 id="prompt"></h2>
      <div id="answers" class="answers"></div>
      <div class="quiz-actions">
        <button id="previous" class="back" type="button">← 返回上一题</button>
      </div>
    </div>
  </section>

  <!-- ========== 结果 ========== -->
  <section id="result" class="hidden">
    <div class="done">
      <span>测试完成</span>
      <div class="bar"><div class="fill" style="width:100%"></div></div>
    </div>

    <div class="result-head">
      <span id="code" class="code"></span>
      <h2 id="title"></h2>
      <p id="quote"></p>
    </div>

    <div class="card-wrap">
      <img id="card" alt="我的 AI 程序员画像卡片">
    </div>
    <div class="card-hint">
      <b>长按上方卡片</b>保存到相册，再发朋友圈 —— 卡片上带你的专属邀请码 <b id="hintCode">BSHHCZ</b>
    </div>

    <div class="share-box">
      <h3>分享文案</h3>
      <p id="sharePreview" class="share-preview"></p>
      <div class="share-actions">
        <button id="copy" class="button" type="button">复制文案</button>
        <button id="shuffle" class="button alt" type="button">换个说法</button>
      </div>
    </div>

    <a id="cta" class="button cta" href="#">解锁完整画像报告 →</a>

    <p class="footnote">
      测试结果由 12 道题的作答方式推导，仅供自我参照。<br>
      完整报告在 DataClawHub 平台内查看。
    </p>
    <p style="margin-top:18px">
      <button id="again" class="button alt" type="button">再测一次</button>
    </p>
  </section>

</main>
<div id="toast" class="toast"></div>

<script>
(function(){
  'use strict';

  /* ---------- 配置 ---------- */
  var INVITE_CODE = 'BSHHCZ';
  var REGISTER_URL = 'https://dataclawhub.com/login?mode=register&ref=' + INVITE_CODE;
  var STORE_KEY = 'ai_profile_progress_v1';

  /* ---------- 题库（12 题，每题 2 选项，各标注所属极） ---------- */
  var QUESTIONS = [
    { q:'你在做一个「区域仓补货建议」智能体。上线前，团队要你确认规则逻辑。你更可能先做哪件事？',
      a:[ {t:'拉出近一年订单、库存与在途数据，看清分布和异常点，再据此定规则', p:'D'},
          {t:'先和一线仓管聊一轮，形成对问题的整体判断，再去数据里找印证', p:'N'} ] },
    { q:'你的智能体在测试环境表现正常，但在真实仓库里出现了几笔明显不合理的建议。你第一步会：',
      a:[ {t:'调出这几笔的完整输入数据与推理链路，逐条比对', p:'D'},
          {t:'先去现场看这几笔发生的实际情境，理解当时的业务状态', p:'N'} ] },
    { q:'平台要你评估一个已上线的智能体「值不值得继续投入」。你更依赖哪种判断？',
      a:[ {t:'看它近三个月的调用量、准确率与人工介入率的变化曲线', p:'D'},
          {t:'看一线使用者最近的反馈与抱怨集中在哪里', p:'N'} ] },
    { q:'智能体需要新增「PDF 提单字段抽取」能力。评审时你倾向推荐哪条路径？',
      a:[ {t:'接入社区已有的开源工具或 MCP 服务，两周内可完成验证', p:'T'},
          {t:'自研一套抽取流程，可控性与后续迭代空间更大', p:'B'} ] },
    { q:'现成工具能覆盖约 80% 的版式，剩余 20% 需要额外适配。此时你更倾向：',
      a:[ {t:'先用现成方案把主干跑通，把 20% 作为后续迭代项推进', p:'T'},
          {t:'直接自研一版，避免长期被这 20% 的特例牵着走', p:'B'} ] },
    { q:'团队要为一个长期项目选技术底座。你更看重哪一点？',
      a:[ {t:'生态活跃、有社区持续维护，能跟上后续的迭代节奏', p:'T'},
          {t:'代码可控、能按自己的需要修改，不受上游节奏牵制', p:'B'} ] },
    { q:'你有两周时间做一个物流场景的智能体。两种起点，你更愿意选哪个？',
      a:[ {t:'从社区已有的成果出发，在它基础上做出一个更成熟的版本', p:'R'},
          {t:'从一个没人做过的细分问题出发，哪怕只能做到初步可用', p:'P'} ] },
    { q:'面对一个已经有人做过的需求，你更认同下面哪种做法？',
      a:[ {t:'优先复用并改进已有成果，把省下的时间投到集成与验证上', p:'R'},
          {t:'优先重新设计一版，避免被已有方案的假设限制住', p:'P'} ] },
    { q:'你的智能体上线后效果不错。接下来你更想做什么？',
      a:[ {t:'把它整理成别人能直接接入的形式，让更多人用起来', p:'R'},
          {t:'把这次遇到的问题再往前推一步，试一个更难的场景', p:'P'} ] },
    { q:'一个「跨境单证全流程校验」任务交到你手上，周期两周。你更可能怎么开始？',
      a:[ {t:'先把流程拆成若干环节，明确每一环由哪个工具或智能体负责', p:'O'},
          {t:'先挑出最容易出错的那一环，集中精力把它做扎实', p:'H'} ] },
    { q:'回顾一个你参与过的、效果不错的项目，你觉得它做成的主要原因更接近：',
      a:[ {t:'各环节衔接顺畅，整体编排得当', p:'O'},
          {t:'关键环节做得足够深，没有明显短板', p:'H'} ] },
    { q:'项目进入第三周，进度落后于计划。你更倾向于：',
      a:[ {t:'重新检查各环节的衔接，看瓶颈是不是出在编排上', p:'O'},
          {t:'集中投入在最拖后腿的那个环节，先把它解决掉', p:'H'} ] }
  ];

  /* ---------- 16 型数据 ---------- */
  var TYPES = {
    DTRO:{name:'链式·调度师', quote:'你不造轮子，你让轮子们一起跑起来。'},
    DTRH:{name:'链式·改造师', quote:'先接上，再把它改到好用。'},
    DTPO:{name:'链式·架构师', quote:'先想清楚骨架，再决定每块用什么。'},
    DTPH:{name:'链式·拓荒匠', quote:'没人做过的那块，交给我。'},
    DBRO:{name:'炼金·调度师', quote:'数据要自己洗，环节要串成线。'},
    DBRH:{name:'炼金·改造师', quote:'现成的先用，但骨头得自己啃。'},
    DBPO:{name:'炼金·架构师', quote:'从零搭一套，每一层都要说得清。'},
    DBPH:{name:'炼金·拓荒匠', quote:'自己写，自己啃，做到别人做不到。'},
    NTRO:{name:'嗅觉·调度师', quote:'先有判断，再拼出一条线。'},
    NTRH:{name:'嗅觉·改造师', quote:'哪里不对我一眼能看出来，然后就动手改。'},
    NTPO:{name:'嗅觉·架构师', quote:'先看清全局，再用最少的力气搭起来。'},
    NTPH:{name:'嗅觉·拓荒匠', quote:'凭感觉找对方向，然后一头扎进去。'},
    NBRO:{name:'独行·调度师', quote:'不用多说，把合适的角色摆对位置就行。'},
    NBRH:{name:'独行·改造师', quote:'看着不对就动手，改到对为止。'},
    NBPO:{name:'独行·架构师', quote:'先在心里跑一遍，再把它搭出来。'},
    NBPH:{name:'独行·拓荒匠', quote:'没人做过，那就我来做。'}
  };

  /* ---------- 分享文案模板（3 个，轮换） ---------- */
  var TEMPLATES = [
    function(t, code){ return '12 道题测出我是「' + t.name + '」' + code + '。' + t.quote + '你是什么型？'; },
    function(t){ return '测了下 AI 程序员画像，我是「' + t.name + '」。想知道你是哪种？2 分钟，扫一下就知道。'; },
    function(t){ return t.quote + '\n我是「' + t.name + '」，你是哪个？'; }
  ];
  var tplIndex = 0;

  /* ---------- 元素 ---------- */
  var $ = function(id){ return document.getElementById(id); };
  var elIntro = $('intro'), elQuiz = $('quiz'), elResult = $('result');

  /* ---------- 状态 ---------- */
  var step = 0;
  var picks = [];        // 每题选了第几个选项（0/1）
  var tally = {D:0,N:0,T:0,B:0,R:0,P:0,O:0,H:0};
  var currentType = null;

  /* ---------- 计分 ---------- */
  // 4 个维度，各 3 题；同一维度的两极互补（合计恒为 3）
  // 故「某极 >= 2」即该极胜出，天然无平票
  function computeCode(){
    return (tally.D >= 2 ? 'D' : 'N')
         + (tally.T >= 2 ? 'T' : 'B')
         + (tally.R >= 2 ? 'R' : 'P')
         + (tally.O >= 2 ? 'O' : 'H');
  }

  /* ---------- 渲染题目 ---------- */
  function render(){
    var item = QUESTIONS[step];
    $('count').textContent = pad(step + 1) + ' / ' + pad(QUESTIONS.length);
    $('fill').style.width = (step / QUESTIONS.length * 100) + '%';
    $('eyebrow').textContent = '第 ' + pad(step + 1) + ' 题';
    $('prompt').textContent = item.q;

    var list = $('answers');
    list.innerHTML = '';
    item.a.forEach(function(opt, idx){
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'answer';
      b.textContent = String.fromCharCode(65 + idx) + '. ' + opt.t;
      b.addEventListener('click', function(){ answer(idx); });
      list.appendChild(b);
    });

    $('previous').disabled = (step === 0);
    save();
  }

  function pad(n){ return (n < 10 ? '0' : '') + n; }

  /* ---------- 作答 / 回退 ---------- */
  function answer(idx){
    var pole = QUESTIONS[step].a[idx].p;
    tally[pole]++;
    picks[step] = idx;
    step++;
    if (step < QUESTIONS.length) { render(); window.scrollTo({top:0}); }
    else { showResult(); }
  }

  function previous(){
    if (step === 0) return;
    step--;
    var idx = picks[step];
    if (typeof idx === 'number') { tally[QUESTIONS[step].a[idx].p]--; picks[step] = undefined; }
    render();
    window.scrollTo({top:0});
  }

  /* ---------- 结果 ---------- */
  function showResult(){
    var code = computeCode();
    currentType = TYPES[code];
    if (!currentType) return;

    elQuiz.classList.add('hidden');
    elResult.classList.remove('hidden');

    $('code').textContent = code;
    $('title').textContent = currentType.name;
    $('quote').textContent = currentType.quote;
    $('card').src = './cards/' + code + '.jpg';
    $('card').alt = currentType.name + ' 画像卡片';

    var cta = $('cta');
    cta.href = REGISTER_URL;

    tplIndex = 0;
    renderShare();

    clearSave();
    window.scrollTo({top:0});
  }

  function renderShare(){
    $('sharePreview').textContent = TEMPLATES[tplIndex](currentType, $('code').textContent);
  }

  /* ---------- 复制 ---------- */
  function copyText(text){
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(text).catch(function(){ return legacyCopy(text); });
    }
    return legacyCopy(text);
  }
  function legacyCopy(text){
    try {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.setAttribute('readonly','');
      ta.style.position = 'fixed';
      ta.style.top = '-1000px';
      document.body.appendChild(ta);
      ta.select();
      ta.setSelectionRange(0, text.length);
      var ok = document.execCommand('copy');
      document.body.removeChild(ta);
      return ok ? Promise.resolve() : Promise.reject();
    } catch (e) { return Promise.reject(e); }
  }

  function toast(msg){
    var t = $('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toast._timer);
    toast._timer = setTimeout(function(){ t.classList.remove('show'); }, 2000);
  }

  /* ---------- 本地进度 ---------- */
  function save(){
    try { localStorage.setItem(STORE_KEY, JSON.stringify({step:step, picks:picks})); } catch(e){}
  }
  function load(){
    try {
      var raw = localStorage.getItem(STORE_KEY);
      if (!raw) return false;
      var d = JSON.parse(raw);
      if (!d || !Array.isArray(d.picks)) return false;
      var n = Math.min(d.step || 0, QUESTIONS.length - 1);
      if (n <= 0) return false;
      step = n;
      picks = d.picks.slice(0, n);
      tally = {D:0,N:0,T:0,B:0,R:0,P:0,O:0,H:0};
      for (var i = 0; i < n; i++) {
        var idx = picks[i];
        if (typeof idx === 'number') tally[QUESTIONS[i].a[idx].p]++;
      }
      return true;
    } catch(e){ return false; }
  }
  function clearSave(){
    try { localStorage.removeItem(STORE_KEY); } catch(e){}
  }

  /* ---------- 事件绑定 ---------- */
  $('start').addEventListener('click', function(){
    elIntro.classList.add('hidden');
    elQuiz.classList.remove('hidden');
    if (!load()) { step = 0; picks = []; tally = {D:0,N:0,T:0,B:0,R:0,P:0,O:0,H:0}; }
    render();
    window.scrollTo({top:0});
  });

  $('previous').addEventListener('click', previous);

  $('copy').addEventListener('click', function(){
    var text = $('sharePreview').textContent;
    copyText(text).then(function(){ toast('已复制，去发朋友圈吧'); })
                  .catch(function(){ toast('复制失败，请长按上方文案手动复制'); });
  });

  $('shuffle').addEventListener('click', function(){
    tplIndex = (tplIndex + 1) % TEMPLATES.length;
    renderShare();
    toast('换了一种说法');
  });

  $('again').addEventListener('click', function(){
    step = 0; picks = [];
    tally = {D:0,N:0,T:0,B:0,R:0,P:0,O:0,H:0};
    currentType = null;
    clearSave();
    elResult.classList.add('hidden');
    elIntro.classList.remove('hidden');
    window.scrollTo({top:0,behavior:'smooth'});
  });

})();
</script>
</body>
</html>
